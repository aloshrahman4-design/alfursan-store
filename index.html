<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أزياء الشيخة والأميرات | أزياء وأحذية نسائية</title>
<meta name="description" content="متجر أزياء الشيخة والأميرات - أزياء وأحذية نسائية، جملة ومفرد، توصيل لكل العراق">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --plum:#5C1A33;        /* خمري عميق */
  --plum-dark:#431225;
  --rose-bg:#FAF3F5;     /* خلفية وردية ناعمة */
  --gold:#C9A24B;        /* ذهبي */
  --ink:#2B1B22;
  --muted:#8A6F7B;
  --card:#FFFFFF;
  --ok:#2E7D4F;
  --shadow:0 10px 30px rgba(92,26,51,.10);
  --radius:18px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;
  background:var(--rose-bg);
  color:var(--ink);
  min-height:100vh;
}
h1,h2,h3,.display{font-family:'El Messiri',serif}

/* ===== الهيدر ===== */
header{
  background:linear-gradient(135deg,var(--plum) 0%, #7A2547 100%);
  color:#fff;
  padding:18px 20px 46px;
  position:relative;
}
header::after{ /* حافة أقواس - توقيع التصميم */
  content:"";
  position:absolute;inset-inline:0;bottom:-1px;height:26px;
  background:
    radial-gradient(circle at 50% 0, transparent 12px, var(--rose-bg) 13px);
  background-size:34px 26px;
  background-position:center top;
}
.header-row{
  max-width:1200px;margin:0 auto;
  display:flex;align-items:center;justify-content:space-between;gap:14px;
}
.brand{display:flex;align-items:center;gap:12px}
.brand-badge{
  width:52px;height:52px;border-radius:50%;
  background:var(--gold);color:var(--plum);
  display:grid;place-items:center;
  font-family:'El Messiri';font-weight:700;font-size:1.5rem;
  box-shadow:0 0 0 3px rgba(255,255,255,.25);
  flex-shrink:0;
}
.brand h1{font-size:1.35rem;line-height:1.2}
.brand p{font-size:.8rem;opacity:.85}
.cart-btn{
  background:#fff;color:var(--plum);
  border:none;border-radius:999px;
  padding:10px 18px;font-family:inherit;font-weight:700;font-size:.95rem;
  cursor:pointer;display:flex;align-items:center;gap:8px;
  box-shadow:var(--shadow);
  transition:transform .15s;
}
.cart-btn:hover{transform:translateY(-2px)}
.cart-count{
  background:var(--plum);color:#fff;border-radius:999px;
  min-width:24px;height:24px;display:grid;place-items:center;
  font-size:.8rem;padding:0 6px;
}

/* ===== شريط الأدوات ===== */
.toolbar{
  max-width:1200px;margin:22px auto 6px;padding:0 20px;
  display:flex;flex-wrap:wrap;gap:12px;align-items:center;
}
.search{
  flex:1;min-width:220px;position:relative;
}
.search input{
  width:100%;padding:12px 44px 12px 16px;
  border:1.5px solid #E7D5DC;border-radius:999px;
  font-family:inherit;font-size:.95rem;background:#fff;
  outline:none;transition:border-color .15s;
}
.search input:focus{border-color:var(--plum)}
.search svg{position:absolute;right:16px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 20px 4px;max-width:1200px;margin:0 auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex-shrink:0;border:1.5px solid #E7D5DC;background:#fff;color:var(--ink);
  padding:8px 16px;border-radius:999px;font-family:inherit;font-size:.85rem;
  cursor:pointer;transition:all .15s;white-space:nowrap;
}
.chip.active{background:var(--plum);border-color:var(--plum);color:#fff}

/* ===== الشبكة ===== */
.grid{
  max-width:1200px;margin:18px auto 60px;padding:0 20px;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px;
}
.card{
  background:var(--card);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden;
  display:flex;flex-direction:column;
  transition:transform .18s, box-shadow .18s;
  position:relative;
}
.card:hover{transform:translateY(-4px);box-shadow:0 16px 40px rgba(92,26,51,.16)}
.media{
  position:relative;aspect-ratio:3/4;background:#F1E3E9;
  border-radius:0 0 50% 50% / 0 0 12% 12%; /* قوس سفلي خفيف للصورة */
  overflow:hidden;
}
.media img,.media video{width:100%;height:100%;object-fit:cover;display:block}
.media .ph{ /* صورة بديلة أنيقة */
  width:100%;height:100%;display:grid;place-items:center;
  color:#C9A9B7;font-size:3rem;font-family:'El Messiri';
  background:repeating-linear-gradient(45deg,#F6E9EE,#F6E9EE 12px,#F1E3E9 12px,#F1E3E9 24px);
}
.badge-new{
  position:absolute;top:12px;right:12px;
  background:var(--gold);color:var(--plum);
  font-size:.72rem;font-weight:700;padding:5px 12px;border-radius:999px;
  box-shadow:0 3px 10px rgba(0,0,0,.15);
}
.badge-video{
  position:absolute;top:12px;left:12px;
  background:rgba(0,0,0,.55);color:#fff;
  font-size:.72rem;padding:5px 10px;border-radius:999px;
  display:flex;align-items:center;gap:5px;
}
.body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.cat{font-size:.72rem;color:var(--gold);font-weight:700;letter-spacing:.3px}
.name{font-size:1rem;font-weight:700;line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.desc{font-size:.8rem;color:var(--muted);line-height:1.6;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.tag{background:#F6E9EE;color:var(--plum);font-size:.72rem;padding:4px 10px;border-radius:999px}
.prices{margin-top:auto;padding-top:6px;display:flex;flex-direction:column;gap:2px}
.price{font-size:1.15rem;font-weight:700;color:var(--plum);font-family:'El Messiri'}
.price small{font-size:.75rem;font-weight:400;color:var(--muted)}
.wholesale{font-size:.78rem;color:var(--ok);font-weight:500}
.actions{display:flex;gap:8px;margin-top:10px}
.btn{
  flex:1;border:none;border-radius:12px;padding:11px 10px;
  font-family:inherit;font-weight:700;font-size:.85rem;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:6px;
  transition:filter .15s, transform .1s;
}
.btn:active{transform:scale(.97)}
.btn-cart{background:var(--plum);color:#fff}
.btn-cart:hover{filter:brightness(1.15)}
.btn-wa{background:#E9F7EF;color:#1E7A45;flex:0 0 46px}
.btn-wa:hover{filter:brightness(.95)}
.btn svg{width:17px;height:17px;flex-shrink:0}

/* ===== حالات الصفحة ===== */
.state{
  max-width:520px;margin:70px auto;text-align:center;padding:0 20px;color:var(--muted);
}
.state .big{font-size:3rem;margin-bottom:12px}
.state h2{color:var(--ink);margin-bottom:8px;font-size:1.3rem}
.state button{
  margin-top:16px;background:var(--plum);color:#fff;border:none;
  padding:11px 26px;border-radius:999px;font-family:inherit;font-weight:700;cursor:pointer;
}
.spinner{
  width:44px;height:44px;margin:0 auto 16px;border-radius:50%;
  border:4px solid #EDD9E1;border-top-color:var(--plum);
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== سلة التسوق ===== */
.overlay{
  position:fixed;inset:0;background:rgba(43,27,34,.45);
  opacity:0;pointer-events:none;transition:opacity .2s;z-index:40;
}
.overlay.open{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;bottom:0;left:0;width:min(400px,92vw);
  background:#fff;z-index:50;display:flex;flex-direction:column;
  transform:translateX(-105%);transition:transform .25s ease;
  box-shadow:10px 0 40px rgba(0,0,0,.15);
}
.drawer.open{transform:translateX(0)}
.drawer-head{
  padding:18px 20px;background:var(--plum);color:#fff;
  display:flex;align-items:center;justify-content:space-between;
}
.drawer-head h2{font-size:1.15rem}
.drawer-head button{background:none;border:none;color:#fff;font-size:1.5rem;cursor:pointer;line-height:1}
.drawer-items{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.ci{display:flex;gap:12px;background:var(--rose-bg);border-radius:14px;padding:10px}
.ci img,.ci .ph2{width:64px;height:80px;border-radius:10px;object-fit:cover;flex-shrink:0}
.ci .ph2{background:#F1E3E9;display:grid;place-items:center;color:#C9A9B7;font-size:1.4rem}
.ci-info{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.ci-name{font-size:.85rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci-price{font-size:.82rem;color:var(--plum);font-weight:700}
.qty{display:flex;align-items:center;gap:10px;margin-top:2px}
.qty button{
  width:26px;height:26px;border-radius:8px;border:1.5px solid #E0C7D2;
  background:#fff;cursor:pointer;font-size:1rem;font-weight:700;color:var(--plum);
  display:grid;place-items:center;
}
.ci-remove{background:none;border:none;color:#C25B7C;cursor:pointer;font-size:.75rem;align-self:flex-start}
.drawer-foot{padding:16px 20px;border-top:1.5px solid #F1E3E9;display:flex;flex-direction:column;gap:12px}
.total-row{display:flex;justify-content:space-between;font-weight:700;font-size:1.05rem}
.total-row span:last-child{color:var(--plum);font-family:'El Messiri';font-size:1.2rem}
.btn-checkout{
  background:#25D366;color:#fff;border:none;border-radius:14px;
  padding:14px;font-family:inherit;font-weight:700;font-size:1rem;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:10px;
}
.btn-checkout:disabled{background:#B8E6C9;cursor:not-allowed}
.empty-cart{text-align:center;color:var(--muted);padding:40px 10px}

/* toast */
.toast{
  position:fixed;bottom:24px;right:50%;transform:translate(50%,80px);
  background:var(--ink);color:#fff;padding:12px 22px;border-radius:999px;
  font-size:.9rem;z-index:60;opacity:0;transition:all .25s;
  box-shadow:0 10px 30px rgba(0,0,0,.25);
}
.toast.show{opacity:1;transform:translate(50%,0)}

footer{
  text-align:center;padding:26px 20px 34px;color:var(--muted);font-size:.82rem;
}
footer b{color:var(--plum)}
@media(max-width:520px){
  .grid{grid-template-columns:repeat(2,1fr);gap:12px;padding:0 12px}
  .body{padding:10px 12px 12px}
  .name{font-size:.88rem}
  .price{font-size:1rem}
  .btn{font-size:.78rem;padding:9px 6px}
}
</style>
</head>
<body>

<header>
  <div class="header-row">
    <div class="brand">
      <div class="brand-badge">ش</div>
      <div>
        <h1>أزياء الشيخة والأميرات</h1>
        <p>أزياء وأحذية نسائية · جملة ومفرد · توصيل لكل العراق</p>
      </div>
    </div>
    <button class="cart-btn" onclick="toggleCart(true)">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 6h15l-1.5 9h-12z"/><circle cx="9" cy="20" r="1.6"/><circle cx="18" cy="20" r="1.6"/><path d="M6 6L5 3H2"/></svg>
      السلة <span class="cart-count" id="cartCount">0</span>
    </button>
  </div>
</header>

<div class="toolbar">
  <div class="search">
    <input id="searchBox" type="search" placeholder="دوري على فستان، طقم، حذاء...">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
  </div>
</div>
<div class="chips" id="chips"></div>

<main id="main">
  <div class="state" id="loading">
    <div class="spinner"></div>
    <h2>دنجهّز لج أحلى الموديلات...</h2>
  </div>
  <div class="grid" id="grid" hidden></div>
</main>

<footer>
  <b>أزياء الشيخة والأميرات</b> · للطلب والاستفسار عبر واتساب · بغداد والمحافظات
</footer>

<!-- السلة -->
<div class="overlay" id="overlay" onclick="toggleCart(false)"></div>
<aside class="drawer" id="drawer" aria-label="سلة التسوق">
  <div class="drawer-head">
    <h2>سلة التسوق</h2>
    <button onclick="toggleCart(false)" aria-label="إغلاق">×</button>
  </div>
  <div class="drawer-items" id="cartItems"></div>
  <div class="drawer-foot">
    <div class="total-row"><span>المجموع</span><span id="cartTotal">0 د.ع</span></div>
    <button class="btn-checkout" id="checkoutBtn" onclick="checkout()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5.1-1.3A10 10 0 1 0 12 2zm5.4 14.1c-.2.6-1.2 1.1-1.7 1.2-.4.1-1 .1-1.6-.1-.4-.1-.9-.3-1.5-.6-2.6-1.1-4.3-3.8-4.4-4-.1-.2-1.1-1.4-1.1-2.7 0-1.3.7-1.9.9-2.2.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.4.2.5.7 1.8.8 1.9.1.1.1.3 0 .4-.1.2-.1.3-.3.5l-.4.5c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.3 2.4 1.5.3.1.5.1.6-.1.2-.2.7-.8.9-1.1.2-.3.4-.2.6-.1.3.1 1.6.7 1.8.9.3.1.4.2.5.3 0 .2 0 .7-.2 1.3z"/></svg>
      إرسال الطلب على واتساب
    </button>
  </div>
</aside>

<div class="toast" id="toast"></div>

<script>
/* ═══════════════════════════════════════════════
   إعدادات المتجر — عدّل رقم الواتساب فقط
   ═══════════════════════════════════════════════ */
const WHATSAPP_NUMBER = "9647XXXXXXXXX";   // ← حط رقمك هنا بالصيغة الدولية بدون +
const FIREBASE_PROJECT = "alfursan-market";
const COLLECTION = "products";

/* ─────────── قراءة المنتجات من Firestore مباشرة (REST) ─────────── */
const API = `https://firestore.googleapis.com/v1/projects/${FIREBASE_PROJECT}/databases/(default)/documents/${COLLECTION}`;

let PRODUCTS = [];
let activeCat = "الكل";
let CART = loadCart();

init();

async function init(){
  updateCartUI();
  try{
    PRODUCTS = await fetchAllProducts();
    if(!PRODUCTS.length){ showEmpty(); return; }
    buildChips();
    render();
  }catch(err){
    console.error(err);
    showError();
  }
}

async function fetchAllProducts(){
  let docs = [], pageToken = "", guard = 0;
  do{
    const url = API + `?pageSize=300${pageToken ? "&pageToken="+pageToken : ""}`;
    const res = await fetch(url);
    if(!res.ok) throw new Error("HTTP "+res.status);
    const data = await res.json();
    docs = docs.concat(data.documents || []);
    pageToken = data.nextPageToken || "";
    guard++;
  }while(pageToken && guard < 5);
  return docs.map(parseDoc).sort((a,b)=> (b.createdAt||0) - (a.createdAt||0));
}

/* تحويل صيغة Firestore REST إلى كائن بسيط + تنظيف القيم الناقصة */
function parseDoc(doc){
  const f = doc.fields || {};
  const val = v => {
    if(v == null) return null;
    if("stringValue" in v)  return v.stringValue;
    if("integerValue" in v) return Number(v.integerValue);
    if("doubleValue" in v)  return Number(v.doubleValue);
    if("booleanValue" in v) return v.booleanValue;
    if("timestampValue" in v) return new Date(v.timestampValue).getTime();
    if("nullValue" in v) return null;
    if("arrayValue" in v) return (v.arrayValue.values||[]).map(val);
    if("mapValue" in v){ const o={}; for(const k in (v.mapValue.fields||{})) o[k]=val(v.mapValue.fields[k]); return o; }
    return null;
  };
  const g = k => val(f[k]);

  const clean = s => {
    if(s == null) return "";
    s = String(s).trim();
    return (s === "" || s === "غير محدد" || s === "null" || s === "undefined") ? "" : s;
  };

  const imgs = [g("images")].flat().filter(Boolean).map(clean).filter(Boolean);
  const single = clean(g("image"));
  if(single && !imgs.includes(single)) imgs.unshift(single);

  let sizes = g("sizes");
  if(Array.isArray(sizes)) sizes = sizes.map(clean).filter(Boolean);
  else sizes = clean(sizes) ? clean(sizes).split(/[،,\/\-\s]+/).filter(Boolean) : [];

  let colors = g("colors") ?? g("color");
  if(Array.isArray(colors)) colors = colors.map(clean).filter(Boolean);
  else colors = clean(colors) ? clean(colors).split(/[،,\/]+/).map(s=>s.trim()).filter(Boolean) : [];

  return {
    id: doc.name.split("/").pop(),
    name: clean(g("name")) || "موديل جديد",
    description: clean(g("description")),
    price: Number(g("price")) || 0,
    wholesalePrice: Number(g("wholesalePrice")) || 0,
    category: clean(g("category")) || "منوعات",
    sizes, colors,
    images: imgs,
    video: clean(g("video")),
    createdAt: g("createdAt") || 0,
  };
}

/* ─────────── العرض ─────────── */
const fmt = n => n > 0 ? n.toLocaleString("en-US") + " د.ع" : "";

function buildChips(){
  const cats = ["الكل", ...new Set(PRODUCTS.map(p=>p.category))];
  const box = document.getElementById("chips");
  box.innerHTML = cats.map(c =>
    `<button class="chip ${c===activeCat?'active':''}" onclick="setCat('${c.replace(/'/g,"\\'")}')">${c}</button>`
  ).join("");
}
function setCat(c){ activeCat = c; buildChips(); render(); }

document.getElementById("searchBox").addEventListener("input", render);

function render(){
  const q = document.getElementById("searchBox").value.trim();
  const list = PRODUCTS.filter(p =>
    (activeCat==="الكل" || p.category===activeCat) &&
    (!q || (p.name+" "+p.description+" "+p.category).includes(q))
  );
  document.getElementById("loading").style.display = "none";
  const grid = document.getElementById("grid");
  grid.hidden = false;

  if(!list.length){
    grid.innerHTML = `<div class="state" style="grid-column:1/-1"><div class="big">🔍</div><h2>ماكو نتائج</h2><p>جربي كلمة ثانية أو صنف ثاني</p></div>`;
    return;
  }

  const NOW = Date.now(), NEW_MS = 48*3600*1000;
  grid.innerHTML = list.map(p => {
    const img = p.images[0];
    const isNew = p.createdAt && (NOW - p.createdAt) < NEW_MS;
    const media = p.video
      ? `<video src="${esc(p.video)}" ${img?`poster="${esc(img)}"`:""} controls playsinline preload="metadata"></video>`
      : img
        ? `<img src="${esc(img)}" alt="${esc(p.name)}" loading="lazy" onerror="this.outerHTML='<div class=ph>ش</div>'">`
        : `<div class="ph">ش</div>`;
    return `
    <article class="card">
      <div class="media">
        ${media}
        ${isNew ? `<span class="badge-new">جديد ✦</span>` : ""}
        ${p.video ? `<span class="badge-video">▶ فيديو</span>` : ""}
      </div>
      <div class="body">
        <span class="cat">${esc(p.category)}</span>
        <h3 class="name">${esc(p.name)}</h3>
        ${p.description ? `<p class="desc">${esc(p.description)}</p>` : ""}
        ${(p.sizes.length||p.colors.length) ? `<div class="meta">
            ${p.sizes.slice(0,4).map(s=>`<span class="tag">${esc(s)}</span>`).join("")}
            ${p.colors.slice(0,3).map(c=>`<span class="tag">${esc(c)}</span>`).join("")}
        </div>`:""}
        <div class="prices">
          <span class="price">${p.price>0 ? fmt(p.price) : `<small>السعر عند الطلب</small>`}</span>
          ${p.wholesalePrice>0 ? `<span class="wholesale">جملة: ${fmt(p.wholesalePrice)}</span>` : ""}
        </div>
        <div class="actions">
          <button class="btn btn-cart" onclick="addToCart('${p.id}')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 6h15l-1.5 9h-12z"/><circle cx="9" cy="20" r="1.6"/><circle cx="18" cy="20" r="1.6"/><path d="M6 6L5 3H2"/></svg>
            أضيفي للسلة
          </button>
          <button class="btn btn-wa" title="اطلبي هذا المنتج مباشرة" onclick="orderSingle('${p.id}')">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5.1-1.3A10 10 0 1 0 12 2zm5.4 14.1c-.2.6-1.2 1.1-1.7 1.2-.4.1-1 .1-1.6-.1-.4-.1-.9-.3-1.5-.6-2.6-1.1-4.3-3.8-4.4-4-.1-.2-1.1-1.4-1.1-2.7 0-1.3.7-1.9.9-2.2.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.4.2.5.7 1.8.8 1.9.1.1.1.3 0 .4-.1.2-.1.3-.3.5l-.4.5c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.3 2.4 1.5.3.1.5.1.6-.1.2-.2.7-.8.9-1.1.2-.3.4-.2.6-.1.3.1 1.6.7 1.8.9.3.1.4.2.5.3 0 .2 0 .7-.2 1.3z"/></svg>
          </button>
        </div>
      </div>
    </article>`;
  }).join("");
}

function showEmpty(){
  document.getElementById("loading").innerHTML =
    `<div class="big">🛍️</div><h2>المتجر جاهز</h2><p>أول ما ننزّل موديلات جديدة راح تشوفينها هنا فوراً</p>`;
}
function showError(){
  document.getElementById("loading").innerHTML =
    `<div class="big">⚠️</div><h2>ما گدرنا نجيب المنتجات</h2><p>تأكدي من الإنترنت وجربي مرة ثانية</p>
     <button onclick="location.reload()">إعادة المحاولة</button>`;
}
function esc(s){ return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

/* ─────────── السلة ─────────── */
function loadCart(){ try{ return JSON.parse(localStorage.getItem("cart_v1")) || {}; }catch(e){ return {}; } }
function saveCart(){ try{ localStorage.setItem("cart_v1", JSON.stringify(CART)); }catch(e){} }

function addToCart(id){
  CART[id] = (CART[id]||0) + 1;
  saveCart(); updateCartUI();
  toast("انضاف للسلة ✓");
}
function changeQty(id, d){
  CART[id] = (CART[id]||0) + d;
  if(CART[id] <= 0) delete CART[id];
  saveCart(); updateCartUI();
}
function removeItem(id){ delete CART[id]; saveCart(); updateCartUI(); }

function updateCartUI(){
  const count = Object.values(CART).reduce((a,b)=>a+b,0);
  document.getElementById("cartCount").textContent = count;

  const box = document.getElementById("cartItems");
  const ids = Object.keys(CART);
  if(!ids.length){
    box.innerHTML = `<div class="empty-cart">السلة فارغة<br>ضيفي منتجاتج المفضلة 💜</div>`;
    document.getElementById("cartTotal").textContent = "0 د.ع";
    document.getElementById("checkoutBtn").disabled = true;
    return;
  }
  document.getElementById("checkoutBtn").disabled = false;

  let total = 0;
  box.innerHTML = ids.map(id => {
    const p = PRODUCTS.find(x=>x.id===id);
    if(!p) return "";
    const qty = CART[id];
    total += (p.price||0) * qty;
    const img = p.images[0];
    return `<div class="ci">
      ${img ? `<img src="${esc(img)}" alt="">` : `<div class="ph2">ش</div>`}
      <div class="ci-info">
        <span class="ci-name">${esc(p.name)}</span>
        <span class="ci-price">${p.price>0 ? fmt(p.price) : "السعر عند الطلب"}</span>
        <div class="qty">
          <button onclick="changeQty('${id}',1)">+</button>
          <span>${qty}</span>
          <button onclick="changeQty('${id}',-1)">−</button>
        </div>
      </div>
      <button class="ci-remove" onclick="removeItem('${id}')">حذف</button>
    </div>`;
  }).join("");
  document.getElementById("cartTotal").textContent = total>0 ? fmt(total) : "حسب الطلب";
}

function toggleCart(open){
  document.getElementById("drawer").classList.toggle("open", open);
  document.getElementById("overlay").classList.toggle("open", open);
}

/* ─────────── الطلب عبر واتساب ─────────── */
function waLink(msg){
  return `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`;
}
function orderSingle(id){
  const p = PRODUCTS.find(x=>x.id===id); if(!p) return;
  let msg = `السلام عليكم 🌸\nحابة أطلب من متجر أزياء الشيخة والأميرات:\n\n• ${p.name}`;
  if(p.price>0) msg += `\n  السعر: ${fmt(p.price)}`;
  if(p.sizes.length) msg += `\n  القياسات المتوفرة: ${p.sizes.join("، ")}`;
  if(p.images[0]) msg += `\n  صورة المنتج: ${p.images[0]}`;
  msg += `\n\nممكن التفاصيل؟ 💜`;
  window.open(waLink(msg), "_blank");
}
function checkout(){
  const ids = Object.keys(CART); if(!ids.length) return;
  let msg = `السلام عليكم 🌸\nحابة أطلب من متجر أزياء الشيخة والأميرات:\n`;
  let total = 0;
  ids.forEach((id,i) => {
    const p = PRODUCTS.find(x=>x.id===id); if(!p) return;
    const qty = CART[id];
    msg += `\n${i+1}. ${p.name} × ${qty}`;
    if(p.price>0){ msg += ` — ${fmt(p.price*qty)}`; total += p.price*qty; }
  });
  if(total>0) msg += `\n\nالمجموع: ${fmt(total)}`;
  msg += `\n\nشكراً 💜`;
  window.open(waLink(msg), "_blank");
}

function toast(t){
  const el = document.getElementById("toast");
  el.textContent = t; el.classList.add("show");
  setTimeout(()=>el.classList.remove("show"), 1800);
}
</script>
